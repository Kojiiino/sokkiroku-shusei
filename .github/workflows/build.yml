name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "シークレット KEYSTORE_BASE64 が未設定です" | tee build.log
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk sokkiroku-shusei-${{ github.run_number }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ビルド ${{ github.run_number }}
          files: sokkiroku-shusei-*.apk
          make_latest: true

      # ビルド結果のログを build-log ブランチに残す（不具合調査用。鍵は含まない）
      - name: Publish build log
        if: always()
        run: |
          touch build.log
          mkdir -p /tmp/logbr && cd /tmp/logbr
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          { echo "run=${{ github.run_number }} status=${{ job.status }} sha=${{ github.sha }}"; \
            grep -E "^e: |error:|FAILURE|BUILD (SUCCESSFUL|FAILED)|What went wrong|> " \
              "$GITHUB_WORKSPACE/build.log" | head -200; \
            echo "----- tail -----"; tail -80 "$GITHUB_WORKSPACE/build.log"; } > build-log.txt
          git add build-log.txt
          git commit -qm "build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:build-log
